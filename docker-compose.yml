services:
  postgres:
    container_name: donaldspostgres
    image: postgres:latest
    environment:
      - POSTGRES_PASSWORD=mcdonalds
      - POSTGRES_USER=postgres
      - POSTGRES_DB=mydb
    ports:
      - "5432:5432"
    volumes:
      - /home/erica/projects/mc_donalds/postgres-data:/var/lib/postgresql/data
